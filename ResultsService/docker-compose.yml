services:
  postgres:
    image: postgres:18
    container_name: results-postgres

    environment:
      POSTGRES_DB: ResultsDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ResultsDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: ResultsService.Api/Dockerfile

    container_name: results-api

    ports:
      - "8080:8080"
      - "8081:8081"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=ResultsDb;Username=postgres;Password=postgres"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: